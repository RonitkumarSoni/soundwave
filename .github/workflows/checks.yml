name: App checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm --prefix backend run lint
      - run: npm run check:backend
      - run: npm --prefix backend run test:e2e -- --runInBand
      - run: npx expo export --platform web --output-dir .audit-web-export
      - run: npx expo export --platform android --output-dir .audit-android-export
